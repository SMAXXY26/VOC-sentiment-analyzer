global:
  scrape_interval: 10s
  evaluation_interval: 10s

# DLT / backlog / inference-health alerts (surfaced in Prometheus /alerts; wire an
# Alertmanager for paging). The DLT alerts are what stop feedback.failed being silent.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: cx_producer
    static_configs:
      - targets: ["producer:9001"]

  - job_name: cx_consumer
    static_configs:
      - targets: ["consumer:9002"]

  # Python analyzer pipeline metrics (stage/request latency, dedup cache hit ratio,
  # llm token/call accounting, pipeline_confidence distribution, needs_review rate).
  - job_name: cx_analyzer
    metrics_path: /metrics
    static_configs:
      - targets: ["analyzer:8080"]

  # vLLM inference metrics (TTFT, inter-token latency, prefix-cache hit rate,
  # KV-cache utilization, queue depth). vLLM is bare-metal on the dev laptop; from a
  # compose network reach the host via host.docker.internal (or set the LAN IP).
  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
