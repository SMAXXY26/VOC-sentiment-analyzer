services:

  # ── vLLM Inference Server (long-running, GPU) ─────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: cx-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./.hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct-AWQ
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --dtype
      - half
      - --max-model-len
      - "1024"
      - --gpu-memory-utilization
      - "0.82"
      - --quantization
      - awq_marlin
      - --max-num-seqs
      - "2"
      - --enforce-eager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 8gb
    restart: unless-stopped
    networks:
      - cx-net

  # ── GPU Embedding Microservice (standalone, 1650 Ti) ─────────────────────
  embedder:
    build:
      context: ./services/embedder
      dockerfile: Dockerfile
    image: cx-embedder
    container_name: cx-embedder
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./.hf_cache:/root/.cache/huggingface
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - cx-net

  # ── FastAPI Analyzer (lightweight, CPU) ───────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: semantic-analyzer-dev
    container_name: cx-analyzer
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDER_URL=http://embedder:8081
      - PYTHONUNBUFFERED=1
    volumes:
      - /home/vinesh/Documents/Summer2026:/workspace
    working_dir: /workspace
    ports:
      - "8080:8080"
    command: ["uvicorn", "analyzer.api:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      vllm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cx-net

  # ── Kafka (Redpanda — no ZooKeeper) ───────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v23.3.18
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr redpanda:8082
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "9092:9092"
      - "8082:8082"   # REST proxy
      - "9644:9644"   # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped
    networks:
      - cx-net

  # ── Rust Producer (HTTP → Kafka) ───────────────────────────────────────────
  producer:
    build:
      context: ./kafka_queue
      dockerfile: Dockerfile
    image: cx-producer
    container_name: cx-producer
    command: producer
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_RAW_TOPIC=feedback.raw
      - PRODUCER_ADDR=0.0.0.0:3001
      - METRICS_ADDR=0.0.0.0:9001
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3001:3001"   # HTTP ingestion
      - "9001:9001"   # Prometheus metrics
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cx-net

  # ── Rust Consumer (Kafka → Python Analyzer) ────────────────────────────────
  consumer:
    build:
      context: ./kafka_queue
      dockerfile: Dockerfile
    image: cx-consumer
    container_name: cx-consumer
    command: consumer
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_RAW_TOPIC=feedback.raw
      - KAFKA_ANALYZED_TOPIC=feedback.analyzed
      - ANALYZER_URL=http://analyzer:8080/analyze
      - KAFKA_GROUP_ID=cx-analyzer-group
      - MAX_CONCURRENT=4
      - METRICS_ADDR=0.0.0.0:9002
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "pgrep", "consumer"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "9002:9002"   # Prometheus metrics
    depends_on:
      redpanda:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cx-net

  # ── Next.js Dashboard ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cx-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://analyzer:8080
    ports:
      - "3000:3000"
    depends_on:
      analyzer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cx-net

  # ── Qdrant Vector DB ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - cx-net

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - cx-net

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host 3030 → container 3000: the Next.js dashboard already owns host 3000.
      # Grafana keeps its default internal port; only the host mapping changes.
      - "3030:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cx-net

volumes:
  redpanda-data:
  prometheus-data:
  grafana-data:
  qdrant-data:

networks:
  cx-net:
    driver: bridge
