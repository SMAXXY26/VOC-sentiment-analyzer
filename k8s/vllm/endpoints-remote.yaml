apiVersion: v1
kind: Endpoints
metadata:
  name: vllm
  namespace: cx-pipeline
subsets:
  - addresses:
      # Dev laptop's Tailscale IP (run `tailscale ip -4` on the laptop).
      # Routes vLLM over the tailnet when the laptop is off the home LAN.
      # Revert to k8s/vllm/endpoints.yaml (192.168.1.11) when back on the LAN.
      - ip: 100.118.86.106   # dev laptop (vinesh-83dg) Tailscale IP
    ports:
      - port: 8000
