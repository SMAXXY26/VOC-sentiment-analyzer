apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: cx-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: producer
          image: cx-producer
          imagePullPolicy: Never
          command: ["producer"]
          env:
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
            - name: KAFKA_RAW_TOPIC
              value: "feedback.raw"
            - name: PRODUCER_ADDR
              value: "0.0.0.0:3001"
            - name: METRICS_ADDR
              value: "0.0.0.0:9001"
            - name: RUST_LOG
              value: "info"
            # Fleet health probes (in-cluster DNS). Defaults match these if unset.
            - name: ANALYZER_HEALTH_URL
              value: "http://analyzer:8080/ready"
            - name: VLLM_HEALTH_URL
              value: "http://vllm:8000/health"
            # Enable small/big model routing by pointing at the draft endpoint.
            # Leave unset to route everything to the big model (safe default).
            - name: DRAFT_LLM_URL
              value: "http://draft-llm:8001"
          ports:
            - containerPort: 3001
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "100m"
