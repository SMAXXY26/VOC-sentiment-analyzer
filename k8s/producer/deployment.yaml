apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: cx-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: cx-producer
          imagePullPolicy: Never
          command: ["producer"]
          env:
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
            - name: KAFKA_RAW_TOPIC
              value: "feedback.raw"
            - name: PRODUCER_ADDR
              value: "0.0.0.0:3001"
            - name: METRICS_ADDR
              value: "0.0.0.0:9001"
            - name: RUST_LOG
              value: "info"
          ports:
            - containerPort: 3001
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "100m"
