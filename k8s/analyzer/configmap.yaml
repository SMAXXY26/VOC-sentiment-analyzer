apiVersion: v1
kind: ConfigMap
metadata:
  name: analyzer-config
  namespace: cx-pipeline
data:
  # Inference path. The load-aware Rust router (k8s/router/, image cx-router) was never
  # added to the build/import workflow, so the `router` pod wasn't deployed and the analyzer
  # was calling a dead service (every completion -> APIConnectionError). With a single vLLM
  # backend the router only adds a failure point, so we point straight at vllm:8000.
  # To re-enable the router later: build+import cx-router from kafka_queue/src/bin/router.rs,
  # `kubectl apply -f k8s/router/`, then set this back to http://router:8100/v1. Do NOT set
  # VLLM_ENDPOINTS here — list backends in the router's config, not the analyzer's.
  VLLM_BASE_URL: "http://vllm:8000/v1"
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDER_URL: "http://embedder:8083"
  MODEL_NAME: "Qwen/Qwen2.5-7B-Instruct-AWQ"
  DEDUP_THRESHOLD: "0.95"
  RAG_K: "3"
  PYTHONUNBUFFERED: "1"
  # Kafka brokers for the durable store-retry lane (failed Qdrant writes are
  # republished to feedback.store_retry and drained back once Qdrant recovers).
  # Empty = retry lane disabled; falls back to the local file buffer.
  KAFKA_BROKERS: "redpanda:9092"
  # Draft LLM (Qwen2.5-1.5B on server laptop 1650 Ti) — empty = always use big model
  DRAFT_LLM_URL: "http://draft-llm:8001/v1"
  # API auth. AUTH_REQUIRED=true turns the global auth gate ON: every endpoint
  # except /health, /ready, /auth/login, /metrics requires a valid dashboard bearer
  # token (or the static API_KEY below). Without this the API + NodePort are open.
  AUTH_REQUIRED: "true"
  # Optional shared service key (machine-to-machine). The dashboard uses bearer
  # tokens, not this. Leave empty unless a backend service needs X-API-Key.
  API_KEY: ""
  # CORS origins — comma-separated list (e.g. "https://app.example.com").
  # Leave empty to allow all origins (default).
  ALLOWED_ORIGINS: ""
