# Auth secrets for the analyzer. DO NOT commit real values — create the Secret
# out-of-band on the cluster. This file documents the expected keys.
#
# Create it imperatively (recommended — keeps secrets out of git):
#   kubectl create secret generic analyzer-auth -n cx-pipeline \
#     --from-literal=AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DASHBOARD_ADMIN_PASSWORD="<your-strong-password>"
#
# The deployment references it via envFrom: secretRef (optional: true).
apiVersion: v1
kind: Secret
metadata:
  name: analyzer-auth
  namespace: cx-pipeline
type: Opaque
stringData:
  AUTH_SECRET: "replace-with-`openssl rand -hex 32`"
  DASHBOARD_ADMIN_PASSWORD: "replace-with-a-strong-password"
  # Optional: DASHBOARD_ADMIN_USER: "admin"
