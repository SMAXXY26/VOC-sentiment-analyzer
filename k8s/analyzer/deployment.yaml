apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  namespace: cx-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: analyzer
          image: semantic-analyzer-dev
          imagePullPolicy: Never
          command: ["uvicorn", "analyzer.api:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: analyzer-config
            # Auth secrets (AUTH_SECRET, DASHBOARD_ADMIN_PASSWORD). Created out-of-band
            # (not committed): kubectl create secret generic analyzer-auth -n cx-pipeline
            #   --from-literal=AUTH_SECRET=... --from-literal=DASHBOARD_ADMIN_PASSWORD=...
            # See k8s/analyzer/auth-secret.example.yaml. Optional so the pod still starts
            # if it's absent (auth just stays on with a dev-default secret + a warning).
            - secretRef:
                name: analyzer-auth
                optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
            requests:
              memory: "512Mi"
              cpu: "500m"
