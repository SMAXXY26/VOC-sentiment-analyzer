# Prometheus with kubernetes pod service-discovery.
#
# The old config scraped Service ClusterIPs (producer:9001, analyzer:8080, ...).
# That is wrong for >1 replica: a Service load-balances each scrape to a *random*
# backing pod, so latency/cache-hit metrics become noise and counters look like they
# jump around. Pod SD scrapes every pod directly (and each pod declares its own
# metrics port via annotations — handy here since the four components expose metrics
# on four different ports).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cx-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cx
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cx
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cx-pipeline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cx-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cx-pipeline
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      # Scrape every pod in cx-pipeline that opts in with prometheus.io/scrape: "true".
      # prometheus.io/port selects the metrics port; prometheus.io/path the path.
      - job_name: cx_pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["cx-pipeline"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # vLLM runs off-cluster (dev laptop), reached via the headless vllm Service.
      # Its /metrics is the gold standard for inference: vllm:time_to_first_token_seconds,
      # vllm:time_per_output_token_seconds, vllm:gpu_prefix_cache_hit_rate (← the win
      # the semantic scheduler targets), vllm:gpu_cache_usage_perc, num_requests_running/
      # waiting, num_preemptions_total, prompt/generation_tokens_total.
      - job_name: vllm
        static_configs:
          - targets: ["vllm:8000"]
  # Alerting/recording rules (kept in sync with monitoring/alerts.yml). The DLT alerts
  # are what stop feedback.failed from being a silent black hole.
  alerts.yml: |
    groups:
      - name: cx_pipeline_alerts
        rules:
          - alert: DeadLetterMessages
            expr: increase(consumer_dlt_messages_total[5m]) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "Messages are landing in the dead-letter topic"
          - alert: DeadLetterFlood
            expr: rate(consumer_dlt_messages_total[5m]) > 1
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Sustained dead-letter flood (>1/s for 5m)"
          - alert: DeadLetterSendFailures
            expr: increase(consumer_dlt_failures_total[10m]) > 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "Failed to write to the dead-letter topic (message lost)"
          - alert: StoreRetryBacklog
            expr: store_retry_pending > 50
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Qdrant store-retry backlog is growing"
          - alert: InferenceBackendUnhealthy
            expr: producer_fleet_healthy{component="big"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Big (Qwen-7B) inference backend is unhealthy"
          - alert: vLLMHighTTFT
            expr: histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket[5m])) > 2
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "vLLM TTFT p95 above 2s — inference is queueing"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cx-pipeline
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
