apiVersion: batch/v1
kind: CronJob
metadata:
  name: dlt-replay
  namespace: cx-pipeline
spec:
  # Every 15 minutes, drain feedback.failed and redrive transient failures back to
  # feedback.raw. Drain-and-exit (no tight loop); permanent failures are only logged.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dlt-replay
              # Same cx-gateway image as producer/consumer — the dlt_replay binary.
              image: cx-consumer
              imagePullPolicy: Never
              command: ["dlt_replay", "--redrive"]
              env:
                - name: KAFKA_BROKERS
                  value: "redpanda:9092"
                - name: KAFKA_FAILED_TOPIC
                  value: "feedback.failed"
                - name: KAFKA_RAW_TOPIC
                  value: "feedback.raw"
                - name: DLT_IDLE_TIMEOUT_SECS
                  value: "5"
                - name: RUST_LOG
                  value: "info"
              resources:
                limits:
                  memory: "128Mi"
                  cpu: "250m"
                requests:
                  memory: "32Mi"
                  cpu: "50m"
