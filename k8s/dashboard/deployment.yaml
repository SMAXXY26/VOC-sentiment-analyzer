apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: cx-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: cx-dashboard
          imagePullPolicy: Never
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://analyzer:8080"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
