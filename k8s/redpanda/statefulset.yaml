apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: cx-pipeline
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v23.3.18
          command: ["/bin/sh", "-c"]
          args:
            - >
              rpk redpanda start
              --mode dev-container
              --kafka-addr PLAINTEXT://0.0.0.0:9092
              --advertise-kafka-addr PLAINTEXT://redpanda:9092
          ports:
            - containerPort: 9092
            - containerPort: 8082
          # Liveness: cheap TCP check on the Kafka port. Kept deliberately
          # lighter than readiness — `rpk cluster health` can blip during
          # normal operation, and we don't want that to trigger a restart.
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "health"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            limits:
              memory: "3Gi"
              cpu: "1"
            requests:
              memory: "1Gi"
              cpu: "250m"
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
  # volumeClaimTemplates gives each replica its own PVC (redpanda-data-redpanda-0),
  # the StatefulSet-native way to provision storage — replaces the standalone PVC.
  volumeClaimTemplates:
    - metadata:
        name: redpanda-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
